name: Build bundled wheels

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: darwin-amd64
            os: macos-15-intel
          - platform: darwin-arm64
            os: macos-14
          - platform: windows-amd64
            os: windows-latest
          - platform: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NXS_BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/nexus_agent_sdk
      # 从 sdist 重建，避免遗漏 hook、锁文件导致源码安装无法打包。
      - run: uv build --out-dir wheelhouse
      - name: Test installed wheel and bundled runtime
        run: python scripts/test_wheel.py wheelhouse/*.whl
      - name: Verify Linux baseline
        if: startsWith(matrix.platform, 'linux-')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux-amd64) image=quay.io/pypa/manylinux_2_28_x86_64 ;;
            linux-arm64) image=quay.io/pypa/manylinux_2_28_aarch64 ;;
          esac
          docker run --rm -v "$PWD:/io" -w /io "$image" \
            /opt/python/cp313-cp313/bin/python scripts/test_wheel.py wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-amd64'
        with:
          name: sdk-sdist
          path: wheelhouse/*.tar.gz
          if-no-files-found: error
