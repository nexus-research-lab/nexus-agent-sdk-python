name: Python SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev --python ${{ matrix.python }}
      - run: uv run python -m compileall -q examples
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/nexus_agent_sdk

  wheels:
    uses: ./.github/workflows/build-wheels.yml
    with:
      ref: ${{ github.sha }}
